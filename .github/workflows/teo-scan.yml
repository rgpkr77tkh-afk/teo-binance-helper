name: Teo Binance Helper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PAPER scan
        run: python teo_helper.py

# Scheduled GitHub runs are intentionally disabled.
# Reason: GitHub-hosted runner egress from a US Azure region receives
# Binance Futures HTTP 451. The scanner code is preserved for diagnostics.
