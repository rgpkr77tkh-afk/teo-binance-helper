name: Teo Binance Helper

on:
  push:
    branches: [main]
    paths:
      - "teo_helper.py"
      - ".github/workflows/teo-scan.yml"
  workflow_dispatch:
  schedule:
    - cron: "15,30,45 * * * *"

permissions:
  contents: write

concurrency:
  group: teo-binance-helper
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PAPER scan
        run: python teo_helper.py

      - name: Save latest report
        run: |
          git config user.name "teo-binance-helper"
          git config user.email "actions@users.noreply.github.com"
          git add reports/latest.md reports/latest.json
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Update Teo PAPER scan report"
            git push
          fi
